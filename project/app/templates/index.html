{% extends 'base.html'%}


{% block title %}
    <title>Registeration</title>
{% endblock title %}

{% load static %}
{% block css %}
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
{% endblock css %}

{% block content %}
<form action="{% url 'register' %}" method="post">
   {% csrf_token%}
   Image: <input type="file" name="image" value="image">
   video: <input type="file" name="video" value="video">
   Audio: <input type="file" name="audio" value="audio">
   File: <input type="file" name="file" value="file">
   <button type="submit" value="register">register</button>
</form>
{% endblock content %}
